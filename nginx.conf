server {
  listen ${PORT};
  
  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 256;

  # Handle CORS preflight
  location /api/ {
    # Handle OPTIONS (CORS preflight)
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' 'https://autoinvoice-frontend-production.up.railway.app' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Accept, Authorization, Content-Type' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Max-Age' 86400 always;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    proxy_pass https://backend-production-7571.up.railway.app/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host backend-production-7571.up.railway.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 30s;
    proxy_read_timeout 30s;
    
    # Add CORS headers to response
    add_header 'Access-Control-Allow-Origin' 'https://autoinvoice-frontend-production.up.railway.app' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  # Health check endpoint
  location /health {
    return 200 'OK';
    add_header Content-Type text/plain;
  }
}